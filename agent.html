<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent — Metric Movement Explainer — Outcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --text-2: hsl(218 22% 10% / 70%); --color-text-secondary: hsl(218 22% 10% / 70%); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #FFFFFF; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-synthesis: none; overflow: hidden; }

  /* ---- nav rail (shared) ---- */
  .rail { position: fixed; left: 0; top: 0; bottom: 0; width: 48px; z-index: 100; background: #F5F5F5D1; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-right: 1px solid #E6E6E6; }
  .rail-logo { position: absolute; left: 4px; top: 8px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .rail-col { position: absolute; left: 0; top: 59px; width: 48px; display: flex; flex-direction: column; align-items: center; }
  .ric { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 6px; flex-shrink: 0; }
  .ric.active { background: #E6E6E6; }
  .rail-div { position: absolute; left: 10px; top: 352px; width: 28px; height: 1px; background: #0F112814; }
  .rail-search { position: absolute; left: 6px; top: 365px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
  .rail-bell { position: absolute; left: 4px; bottom: 56px; width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; }
  .bell-wrap { position: relative; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .bell-badge { position: absolute; top: -3px; right: -3px; min-width: 15px; height: 15px; display: flex; align-items: center; justify-content: center; padding: 0 3px; border-radius: 6px; background: #F04438; border: 2px solid #FFFFFF; font-size: 9px; line-height: 100%; font-weight: 600; color: #FFFFFF; }
  .rail-avatar { position: absolute; left: 4px; bottom: 16px; width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; }
  .avatar { width: 20px; height: 20px; border-radius: 50%; background: #FBE6F5; border: 1px solid #E7B8DE; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; font-size: 14px; line-height: 16px; font-weight: 600; color: #9E168E; }

  /* ---- header ---- */
  .hd { position: fixed; left: 48px; right: 0; top: 0; height: 48px; z-index: 90; background: #FFFFFF; border-bottom: 1px solid #E6E6E6; display: flex; align-items: center; padding-left: 12px; gap: 8px; }
  .hd-panel { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 4px; flex-shrink: 0; }
  .hd-back { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .hd-title { font-family: system-ui, sans-serif; font-size: 13px; line-height: 20px; color: #171717; }
  .hd-back:hover .hd-title { color: #000; }

  /* ---- 3-pane layout ---- */
  .layout { position: fixed; left: 48px; right: 0; top: 48px; bottom: 0; display: flex; }
  .convo { width: 440px; flex-shrink: 0; position: relative; background: #FFFFFF; border-right: 0.5px solid #D4D4D4; }

  /* small composer pinned at bottom of convo */
  .composer { position: absolute; left: 18px; right: 18px; bottom: 18px; height: 120px; }
  .composer .glow { position: absolute; inset: -1px 0; border-radius: 25px; opacity: 0.55; background: #D4D4D4; }
  .composer .card-c { position: absolute; inset: 0 1px; display: flex; flex-direction: column; gap: 14px; padding: 18px 12px 12px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 1px 10px #0F11280F; }
  .ph { font-size: 14px; line-height: 26px; font-weight: 500; color: #8C8F96; padding: 0 8px; flex: 1; }
  .ctl-row { display: flex; align-items: center; justify-content: space-between; }
  .ctl-left { display: flex; align-items: center; }
  .ctl-right { display: flex; align-items: center; gap: 4px; }
  .cbtn { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .cbtn.send { background: #EAEBEE; }
  .pill { height: 24px; flex-shrink: 0; display: flex; align-items: center; padding: 0 12px; border-radius: 17px; gap: 6px; font-size: 13px; line-height: 18px; font-weight: 500; color: #4A4D53; }

  /* ---- Artifact (report) / Setting segmented control (frame "real life created agent") ---- */
  .seg-ctl {
    position: fixed; top: 66px; z-index: 95;
    left: calc(488px + (100vw - 488px) / 2); transform: translateX(-50%);
    display: flex; padding: 3px; gap: 2px;
    border-radius: 10px; background: #F4F5F7;
    user-select: none; -webkit-user-select: none;
  }
  .seg-ctl .seg {
    height: 32px; display: flex; align-items: center; justify-content: center;
    padding: 0 12px; gap: 7px; border-radius: 7px;
    font-family: system-ui, sans-serif; font-size: 12px; line-height: 16px; font-weight: 500; color: #303030;
    cursor: pointer;
  }
  .seg-ctl .seg svg { color: #303030B3; }
  .seg-ctl .seg.active {
    background: #FFFFFF;
    box-shadow: 0 1px 3px #0000001F, 0 0 0 1px #D7D7D7;
    font-weight: 600;
  }
  .seg-ctl .seg.active svg { color: #303030; }
  @media (max-width: 1100px) { .seg-ctl { left: calc(48px + (100vw - 48px) / 2); } }

  /* ---- Setting view (frame "real life creted agent setting"): Controler 920w at 16px
     insets right of the convo, rows 39px / 0.5px #DDDDDD, ctas 25px below ---- */
  .settings { display: none; flex: 1; min-width: 0; overflow-y: auto; padding: 88px 16px 0; }
  body.setting .doc { display: none; }
  body.setting .settings { display: block; }
  .set-row {
    display: flex; align-items: center; gap: 6px;
    height: 39px; padding: 0 13px;
    border-bottom: 0.5px solid #DDDDDD;
    font-family: system-ui, sans-serif; font-size: 14px; line-height: 18px; font-weight: 500; color: #232323;
  }
  .set-ctas { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 25px; padding-right: 27px; }
  .set-ctas .cta { font-size: 14px; }

  /* ---- report document ---- */
  .doc { flex: 1; min-width: 0; overflow-y: auto; background: #FFFFFF; }
  .doc-inner { width: 874px; max-width: calc(100% - 78px); margin: 0 auto; padding: 53px 0 96px; }
  .report-img { display: block; width: 100%; height: auto; }
  .meta { font-size: 13px; line-height: 18px; font-weight: 500; color: #232323; }
  h1 { font-size: 28px; line-height: 36px; letter-spacing: -0.01em; font-weight: 600; color: #232323; margin-top: 5px; }
  h2 { font-family: system-ui, sans-serif; font-size: 22px; line-height: 30px; letter-spacing: -0.005em; font-weight: 600; color: #232323; margin-top: 54px; }
  .para { font-family: system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #2F2F2F; margin-top: 12px; }

  .lookcard { max-width: 564px; margin-top: 30px; border: 1px solid #DBDFE9; border-radius: 6px; padding: 16px; }
  .lookcard .lc-title { font-family: system-ui, sans-serif; font-size: 16px; line-height: 22px; font-weight: 600; color: #1F1F1F; }
  .bullets { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  .bullet { display: flex; align-items: flex-start; gap: 10px; font-family: system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #2F2F2F; }
  .bullet svg { flex-shrink: 0; }

  .tiles { max-width: 564px; margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { min-height: 106px; border: 1px solid #E6E6E6; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 6px; background: #FFFFFF; }
  .tile .tv { font-size: 22px; line-height: 28px; letter-spacing: -0.02em; font-weight: 600; color: #171717; }
  .tile .tl { font-size: 12px; line-height: 16px; color: #666666; }
  .tile .td { font-size: 12px; line-height: 16px; color: #666666; }
  .tile .td.bad { color: #C4453C; }
  .tile .td.good { color: #16A394; }

  .chartcard { margin-top: 20px; border: 1px solid #DBDFE9; border-radius: 6px; padding: 20px; background: #FFFFFF; }
  .cc-title { font-family: system-ui, sans-serif; font-size: 16px; line-height: 22px; font-weight: 600; color: #1F1F1F; }
  .cc-sub { font-family: system-ui, sans-serif; font-size: 13px; line-height: 18px; color: #6B6B6B; margin-top: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 22px; }
  .li { display: flex; align-items: center; gap: 7px; font-family: system-ui, sans-serif; font-size: 12px; line-height: 16px; color: #6B6B6B; }
  .lsw { width: 11px; height: 11px; border-radius: 2px; flex-shrink: 0; display: inline-block; }

  /* dot plot */
  .dp { margin-top: 16px; }
  .dp-row { display: flex; align-items: center; height: 28px; }
  .dp-lab { width: 145px; flex-shrink: 0; display: flex; align-items: baseline; gap: 5px; }
  .dp-name { font-family: system-ui, sans-serif; font-size: 12px; line-height: 16px; font-weight: 500; color: #1F1F1F; }
  .dp-role { font-family: system-ui, sans-serif; font-size: 11px; line-height: 14px; color: #8F8F8F; }
  .dp-plot { flex: 1; height: 28px; position: relative; }
  .dp-grid .dp-plot { background-image: repeating-linear-gradient(to right, transparent, transparent); }
  .dp-conn { position: absolute; top: 13px; height: 2.5px; background: #CBD2E3; }
  .dp-dot { position: absolute; top: 8px; width: 12px; height: 12px; border-radius: 2px; border: 1.5px solid #FFFFFF; margin-left: -6px; }
  .dp-body { position: relative; }
  .dp-gridlines { position: absolute; left: 145px; right: 0; top: 0; bottom: 58px; pointer-events: none; }
  .dp-gl { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dotted #CFCFCF; }
  .dp-axis { display: flex; height: 22px; align-items: flex-end; }
  .dp-axis .sp { width: 145px; flex-shrink: 0; }
  .dp-ax { flex: 1; position: relative; height: 16px; }
  .dp-tick { position: absolute; top: 2px; transform: translateX(-50%); font-family: system-ui, sans-serif; font-size: 11px; line-height: 14px; color: #8F8F8F; }
  .dp-tick.first { transform: none; left: -3px !important; }
  .dp-cap { display: flex; margin-top: 8px; }
  .dp-cap .sp { width: 145px; flex-shrink: 0; }
  .dp-cap .t { flex: 1; text-align: center; font-family: system-ui, sans-serif; font-size: 12px; line-height: 16px; color: #8F8F8F; }

  /* stacked bands */
  .sb { margin-top: 20px; display: flex; flex-direction: column; gap: 16px; }
  .sb-row { display: flex; align-items: center; }
  .sb-lab { width: 120px; flex-shrink: 0; }
  .sb-name { font-family: system-ui, sans-serif; font-size: 12px; line-height: 16px; font-weight: 700; color: #1F1F1F; }
  .sb-sub { font-family: system-ui, sans-serif; font-size: 11px; line-height: 14px; color: #8F8F8F; }
  .sb-bar { flex: 1; height: 40px; display: flex; }
  .sb-seg { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; font-size: 12px; line-height: 16px; }

  /* lapsed bars */
  .lp { margin-top: 22px; }
  .lp-head { display: flex; padding-bottom: 8px; border-bottom: 1px solid #ECECEC; font-family: system-ui, sans-serif; font-size: 12px; line-height: 16px; color: #8F8F8F; }
  .lp-head .c1 { width: 110px; flex-shrink: 0; }
  .lp-rows { margin-top: 6px; }
  .lp-row { display: flex; align-items: center; height: 29px; }
  .lp-lab { width: 110px; flex-shrink: 0; font-family: system-ui, sans-serif; font-size: 12px; line-height: 16px; color: #2F2F2F; }
  .lp-track { flex: 1; height: 20px; position: relative; background: #EDEDED; }
  .lp-bar { position: absolute; left: 0; top: 0; height: 20px; }
  .lp-val { position: absolute; top: 2px; font-family: system-ui, sans-serif; font-size: 12px; line-height: 16px; color: #3E4658; }
  .lp-axis { display: flex; margin-top: 6px; }
  .lp-axis .c1 { width: 110px; flex-shrink: 0; }
  .lp-ax { flex: 1; position: relative; height: 20px; border-top: 1px solid #6B6B6B; }
  .lp-tick { position: absolute; top: 5px; transform: translateX(-50%); font-family: system-ui, sans-serif; font-size: 11px; line-height: 14px; color: #8F8F8F; }
  .lp-tick.first { transform: none; left: -3px !important; }

  /* activity table */
  .atable-wrap { margin-top: 16px; overflow-x: auto; }
  .atable { min-width: 506px; }
  .th { display: flex; align-items: center; height: 24px; border-bottom: 1.5px solid #D8D8D8; font-family: system-ui, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.05em; font-weight: 600; color: #8F8F8F; }
  .tr { display: flex; align-items: center; height: 34px; border-bottom: 1px solid #F2F2F2; }
  .tr.group { background: #FAFAFA; }
  .tc { flex-shrink: 0; font-family: system-ui, sans-serif; font-size: 12px; line-height: 16px; color: #2F2F2F; }
  .tc.name { flex: 1 1 150px; min-width: 120px; font-weight: 700; }
  .tc.name.ind { padding-left: 12px; }
  .tr.group .tc { font-weight: 700; color: #1F1F1F; }
  .tc.role { width: 64px; color: #6B6B6B; }
  .tc.num { width: 64px; text-align: right; }
  .tc.num.w80 { width: 76px; }
  .tc.band { display: flex; align-items: center; gap: 7px; padding-left: 18px; width: 118px; }
  .bchip { width: 11px; height: 11px; border-radius: 2px; flex-shrink: 0; display: inline-block; }
  .tfoot { margin-top: 12px; font-family: system-ui, sans-serif; font-size: 12px; line-height: 16px; color: #8F8F8F; }

  /* zero-activity card */
  .zc { margin-top: 12px; border: 1px solid #DBDFE9; border-radius: 6px; padding: 20px; }
  .zc .legend { margin-top: 0; }
  .zc-strip { margin-top: 12px; display: flex; height: 28px; }
  .zc-seg { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; font-size: 12px; line-height: 16px; color: #3E4658; }
  .zc-div { height: 1px; background: #DDDDDD; margin: 16px 0; }
  .zc-ft { font-family: system-ui, sans-serif; font-size: 13px; line-height: 18px; font-weight: 600; color: #232323; }
  .zc-list { margin-top: 4px; font-family: 'IBM Plex Mono', system-ui, monospace; font-size: 12px; line-height: 20px; color: #8A3730; }

  /* recommended */
  .recs { margin-top: 8px; }
  .rec { display: flex; gap: 20px; padding: 20px 0; border-bottom: 1px solid #E6E6E6; }
  .rec-num { flex-shrink: 0; font-family: system-ui, sans-serif; font-size: 18px; line-height: 26px; font-weight: 600; color: #4D4D4D; }
  .rec-title { font-family: system-ui, sans-serif; font-size: 18px; line-height: 26px; font-weight: 600; color: #232323; }
  .rec-text { margin-top: 4px; font-family: system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #2E2E2E; }

  /* methodology */
  .mth { margin-top: 16px; }
  .mh { display: flex; align-items: center; height: 24px; border-bottom: 1.5px solid #D8D8D8; font-family: system-ui, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.05em; font-weight: 600; color: #8F8F8F; }
  .mh .c1 { width: 190px; flex-shrink: 0; }
  .mr { display: flex; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid #F2F2F2; }
  .mr-term { width: 190px; flex-shrink: 0; font-family: system-ui, sans-serif; font-size: 12px; line-height: 17px; font-weight: 700; color: #2F2F2F; }
  .mr-def { font-family: system-ui, sans-serif; font-size: 12px; line-height: 17px; color: #2F2F2F; }
  .mr .bands { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px; }
  .mr .bands .li { gap: 6px; }

  /* ---- right sidebar ---- */
  .side { width: clamp(308px, calc(308px + (100vw - 1440px) * 0.6), 480px); flex-shrink: 0; background: #FFFFFF; border-left: 0.5px solid #D4D4D4; }
  .side-row { display: flex; align-items: center; gap: 6px; height: 39px; padding: 0 13px; border-bottom: 0.5px solid #DDDDDD; font-family: system-ui, sans-serif; font-size: 13px; line-height: 18px; font-weight: 500; color: #232323; }
  .side-row svg { position: static !important; }
  .side-ctas { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 13px; }
  .cta { height: 32px; display: flex; align-items: center; padding: 0 12px; border-radius: 6px; font-family: system-ui, sans-serif; font-size: 13px; line-height: 18px; font-weight: 500; }
  .cta.dark { background: #171717; color: #FFFFFF; text-decoration: none; cursor: pointer; }
  .cta.dark:hover { background: #000000; }
  .hd { padding-right: 20px; }
  .hd-right { margin-left: auto; }
  .cta.dark.disabled { opacity: 0.3; cursor: default; }
  .cta.dark.disabled:hover { background: #171717; }
  .cta.light { background: #FFFFFF; color: #171717; outline: 1px solid #D4D4D4; }

  /* ---- confirmation overlay + modal (frame "3 confirmation screen - edited") ---- */
  .overlay { position: fixed; inset: 0; background: #171717AB; z-index: 400; display: none; }
  .modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 401;
    width: 601px; max-width: calc(100vw - 32px); height: 361px; border-radius: 20px; background: #FFFFFF; display: none; }
  body.modal-open .overlay, body.modal-open .modal { display: block; }
  .modal svg { position: absolute; left: 50%; top: 59px; margin-left: -28px; }
  .modal-title { position: absolute; top: 137px; left: 24px; right: 24px; text-align: center;
    font-size: 28px; line-height: 28px; font-weight: 500; color: #232323; }
  .modal-body { position: absolute; top: 177px; left: 50%; transform: translateX(-50%); width: 423px; max-width: calc(100% - 48px);
    text-align: center; font-size: 17px; line-height: 20px; color: #232323; }
  .modal-btn { position: absolute; top: 271px; left: 50%; margin-left: -48px; width: 96px; height: 48px;
    display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #171717;
    font-family: system-ui, sans-serif; font-size: 15px; line-height: 18px; font-weight: 500; color: #FFFFFF; cursor: pointer; }
  .modal-btn:hover { background: #000000; }

  @media (max-width: 1280px) { .convo { width: 320px; } }
  @media (max-width: 1100px) { .convo { display: none; } }
  @media (max-width: 800px)  { .side  { display: none; } .doc-inner { padding: 32px 24px 80px; } }
</style>
</head>

  <script>
    /* Embedded as the "real life created agent" layer by index.html. */
    function createdClose(e) {
      if (e && e.preventDefault) e.preventDefault();
      if (window.parent !== window) { window.parent.postMessage('rlCreatedClose', '*'); }
      else { window.location.href = './'; }
    }
    document.getElementById('hdBack').addEventListener('click', createdClose);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') createdClose(); });
    var railActive = document.querySelector('.ric.active');
    if (railActive) railActive.addEventListener('click', createdClose);

    /* Artifact (report) / Setting toggle (frame "real life creted agent setting") */
    var segReport = document.getElementById('segReport');
    var segSetting = document.getElementById('segSetting');
    function setSeg(mode) {
      var setting = mode === 'setting';
      document.body.classList.toggle('setting', setting);
      segSetting.classList.toggle('active', setting);
      segReport.classList.toggle('active', !setting);
    }
    segSetting.addEventListener('click', function () { setSeg('setting'); });
    segReport.addEventListener('click', function () { setSeg('report'); });
  </script>
