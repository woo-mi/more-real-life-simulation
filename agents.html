<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents — real life agent home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-fg: #171717;
    --color-line: #E6E6E6;
    --green: #B9E95A;
    --red: #FF777A;
    --dot-gray: #DDDDDD;
    --dot-dim: #F3F3F3;
    --dim: #DDDDDD;
    --muted: #5C5C5E;
    --cell-fg: #2F2F31;
    --icon-gray: #6E6E74;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #FFFFFF; min-height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-synthesis: none;
  }
  .frame {
    position: relative;
    min-height: 100vh;
    background: #FFFFFF;
    display: flex;
    align-items: stretch;
  }
  .main {
    flex: 1;
    min-width: 0;
    min-height: 0;
    margin-left: 48px;
    display: flex;
    flex-direction: column;
  }
  .content {
    width: 100%;
    max-width: 1162px;
    margin: 0 auto;
    padding: 0 24px;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 1258px) {
    .content { padding: 0; }
  }

  /* ---------- Nav rail ---------- */
  .rail {
    position: fixed; left: 0; top: 0; bottom: 0; z-index: 10;
    width: 48px;
    background: rgba(245,245,245,0.82);
    backdrop-filter: blur(14px);
    border-right: 1px solid #E6E6E6;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }
  .rail-logo { width: 40px; height: 40px; margin-top: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rail-list { margin-top: 11px; width: 48px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .rail-item { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rail-item.active { background: #E6E6E6; }
  .rail-divider { width: 28px; height: 1px; margin-top: 5px; background: rgba(15,17,40,0.08); flex-shrink: 0; }
  .rail-search { margin-top: 12px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rail-spacer { flex: 1; }
  .rail-bell { width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .bell-wrap { position: relative; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .bell-badge {
    position: absolute; top: -3px; right: -3px;
    min-width: 15px; height: 15px; padding: 0 3px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px; background: #F04438; border: 2px solid #FFFFFF;
    font-size: 9px; line-height: 1; font-weight: 600; color: #FFFFFF;
  }
  .rail-avatar { width: 40px; height: 36px; margin-top: 4px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rail-avatar .circle {
    width: 20px; height: 20px; border-radius: 50%;
    background: #FBE6F5; border: 1px solid #E7B8DE;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 16px; font-weight: 600; color: #9E168E;
    font-family: system-ui, sans-serif;
  }

  /* ---------- Header ---------- */
  .header {
    position: sticky; top: 0; z-index: 5;
    height: 48px; flex-shrink: 0;
    background: #FFFFFF; border-bottom: 1px solid #E6E6E6;
    display: flex; align-items: center; justify-content: space-between;
    padding-left: 12px; padding-right: 20px;
  }
  .header .crumb { display: flex; align-items: center; gap: 8px; }
  .header .crumb .icon20 { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 6px; flex-shrink: 0; }
  .header .crumb .label { font-size: 14px; line-height: 20px; color: #171717; font-family: system-ui, sans-serif; }

  /* ---------- Tabs row ---------- */
  .toolbar {
    margin-top: 39px;
    min-height: 33px;
    flex-shrink: 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .tabs { display: flex; align-items: center; overflow: hidden; }
  .tab {
    height: 32px; min-width: 28px; max-width: 200px; padding: 0 10px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 9999px; position: relative;
    border: 0.5px solid transparent;
  }
  .tab.active { background: #ECECED; }
  .tab.active::before {
    content: ""; position: absolute; inset: 0; border-radius: 9999px;
    box-shadow: 0 0 0 0.5px rgba(0,0,0,0.09);
  }
  .tab .inner { display: flex; align-items: flex-start; gap: 4px; position: relative; }
  .tab .label { font-size: 12px; line-height: 16px; font-weight: 500; color: #5C5C5E; white-space: nowrap; }
  .tab.active .label { color: #1B1B1B; }
  .tab .mini-avatar {
    width: 16px; height: 16px; border-radius: 50%; position: relative; flex-shrink: 0;
    background: rgba(29,29,31,0.08); border: 1px solid rgba(29,29,31,0.28);
  }
  .tab .mini-avatar span {
    position: absolute; left: 3px; top: 1px;
    font-size: 9px; line-height: 12px; font-weight: 600; color: #1D1D1F;
    font-family: system-ui, sans-serif; text-align: center;
  }
  .controls { display: flex; align-items: flex-start; gap: 12px; }
  .search-box {
    height: 32px; padding: 0 12px; border-radius: 8px;
    border: 1px solid #E6E6E6;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .search-box .placeholder { font-size: 14px; line-height: 18px; color: #4D4D4D; white-space: nowrap; font-family: system-ui, sans-serif; }
  .filter-btn {
    width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
    background: #FFFFFF; outline: 1px solid #E6E6E6;
    display: flex; align-items: center; justify-content: center;
  }
  .primary-btn {
    height: 32px; padding: 0 14px; border-radius: 8px;
    background: #171717; display: flex; align-items: center; gap: 6px;
  }
  .primary-btn .label { font-size: 14px; line-height: 18px; font-weight: 600; color: #FFFFFF; font-family: system-ui, sans-serif; }

  /* ---------- Table ---------- */
  /* The page scrolls vertically (sticky header, fixed rail).
     Horizontal scroll only kicks in when the viewport is too narrow for the dot strip. */
  .table-scroll { margin-top: 31px; overflow-x: auto; flex-shrink: 0; }
  .table { min-width: 894px; }
  .thead, .row {
    display: grid;
    grid-template-columns: minmax(200px, 1fr) 432px 140px 93px 49px;
    align-items: center;
  }
  .thead { height: 36px; }
  .thead .label { font-size: 12px; line-height: 16px; font-weight: 450; font-variation-settings: 'wght' 450; color: #5C5C5E; white-space: nowrap; }
  .h-name { padding: 0 12px; }
  .h-runlogs { padding: 0 22px; }
  .h-owner { padding-left: 6px; padding-right: 12px; }
  .h-modified, .h-action { padding: 0 6px; }

  .row {
    border-radius: 10px;
    transition: background-color 120ms ease;
  }
  .row:hover { background: #F7F7F7; }

  .cell { height: 48px; display: flex; align-items: center; min-width: 0; }

  .cell-name { padding: 0 12px; gap: 8px; }
  .cell-name .status-dot { width: 8px; height: 8px; border-radius: 100px; flex-shrink: 0; }
  .cell-name .status-dot.green { background: var(--green); }
  .cell-name .status-dot.dim { background: #DDDDDD; }
  .cell-name .status-dot.gray { background: #A8A8A8; }
  .cell-name .status-dot.loading { background: transparent; border: 1px dotted #A8A8A8; animation: spin 1.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cell-name .name-wrap { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .cell-name .name {
    font-size: 13px; line-height: 16px; font-weight: 500; color: #1B1B1B;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cell-name.dim .name { color: #DDDDDD; }
  .cell-name.gray .name { color: #A8A8A8; }
  .cell-name svg { flex-shrink: 0; }

  /* Hover-revealed tags + report button (from Paper "hover" frame) */
  .hover-meta {
    display: none; align-items: center; gap: 45px;
    margin-left: 4px; min-width: 0; overflow: hidden;
  }
  .row:hover .hover-meta {
    display: flex;
    animation: meta-in 140ms ease both;
  }
  /* Full name always visible on hover — the tag pills clip instead. */
  .row:hover .cell-name .name-wrap { flex-shrink: 0; }
  @keyframes meta-in {
    from { opacity: 0; transform: translateX(-3px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .tags { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .tag {
    height: 20px; padding: 0 10px; border-radius: 100px; flex-shrink: 0;
    display: flex; align-items: center;
    box-shadow: inset 0 0 0 1px #D4D4D4;
    font-size: 12px; line-height: 16px; font-weight: 500; color: #404040;
    white-space: nowrap;
  }
  .report-btn {
    width: 20px; height: 20px; border-radius: 999px; flex-shrink: 0;
    background: #171717; border: none; padding: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 120ms ease;
  }
  .report-btn:hover { transform: scale(1.1); }
  .report-btn:active { transform: scale(0.95); }

  .cell-runlogs { padding: 0 22px; }
  .dots { display: flex; align-items: flex-start; gap: 2px; }
  .dots .d { width: 8px; height: 8px; border-radius: 100px; flex-shrink: 0; }

  .cell-owner { padding: 0 6px; gap: 4px; }
  .avatar {
    width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .avatar span { font-size: 8px; line-height: 7px; font-weight: 600; font-family: system-ui, sans-serif; }
  .cell-owner .owner-name {
    font-size: 12px; line-height: 15px; color: #2F2F31;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .cell-owner.dim .owner-name { color: #DDDDDD; }

  .cell-modified { padding: 0 6px; }
  .cell-modified .date {
    margin-left: 8px; font-size: 12px; line-height: 16px;
    font-weight: 450; font-variation-settings: 'wght' 450; color: #2F2F31; white-space: nowrap;
  }
  .cell-modified.dim .date { color: #DDDDDD; }

  .cell-action { padding: 0 6px; justify-content: center; gap: 6px; }

  .cell-runlogs { justify-content: space-between; }
  .hover-history {
    width: 20px; height: 20px; border-radius: 999px; flex-shrink: 0;
    background: #171717; border: none; padding: 0;
    display: none; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 120ms ease;
  }
  .row:hover .hover-history { display: flex; animation: meta-in 140ms ease both; }
  .hover-history:hover { transform: scale(1.1); }

  .draft-pill {
    height: 20px; padding: 0 8px; border-radius: 999px; flex-shrink: 0;
    display: flex; align-items: center;
    background: #F2F2F2;
    font-family: system-ui, sans-serif;
    font-size: 10px; line-height: 14px; font-weight: 600; color: #4D4D4D;
  }


  /* "New" chip on the just-created row (frame "real life") */
  .new-chip {
    height: 20px; padding: 0 10px; border-radius: 100px; flex-shrink: 0;
    display: flex; align-items: center;
    box-shadow: inset 0 0 0 1px #D4D4D4;
    font-size: 12px; line-height: 16px; font-weight: 500; color: #404040;
    white-space: nowrap;
  }
  /* ---------- Footer ---------- */
  /* Design: table(907) + 8px -> footer block 48px tall -> 37px white to frame edge (1000). */
  .footer {
    margin-top: 0;
    padding: 16px 0;
    margin-bottom: 0;
    flex-shrink: 0;
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .pager { position: relative; width: 134px; height: 16px; flex-shrink: 0; }
  .pager svg { position: absolute; top: 0; overflow: visible; }
  .pager .txt { position: absolute; left: 20px; top: 1px; font-size: 10px; line-height: 14px; color: #4D4D4D; white-space: nowrap; }
  .rows-per-page { position: relative; width: 107px; height: 16px; flex-shrink: 0; }
  .rows-per-page .txt { position: absolute; left: 0; top: 1px; font-size: 10px; line-height: 14px; color: #4D4D4D; white-space: pre; }
  .rows-per-page svg { position: absolute; left: 91px; top: 0; overflow: visible; }
</style>
</head>

<div class="main">

    <div class="crumb">

        <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1.5" width="14" height="13" rx="2.5" fill="none" stroke="#666666"/>
          <path d="M5.6 1.5 L5.6 14.5" fill="#000000" stroke="#666666"/>
        </svg>
      </div>
      <div class="label">Agents</div>

  <div class="rail">

<script>
(function () {
  var GREEN = '#B9E95A', RED = '#FF777A', GRAY = '#DDDDDD', DIM = '#F3F3F3', WHITE = '#FFFFFF';

  // Run-log patterns: array of 32 colors (measured from frame "real life").
  function fill(color) { var a = []; for (var i = 0; i < 32; i++) a.push(color); return a; }
  function withMarks(base, marks) {
    var a = fill(base);
    Object.keys(marks).forEach(function (color) {
      marks[color].forEach(function (i) { a[i] = color; });
    });
    return a;
  }
  var P2 = withMarks(GRAY, (function () { var m = {}; m[GREEN] = [29]; return m; })());
  var P3 = withMarks(GRAY, (function () { var m = {}; m[GREEN] = [25, 28, 29, 30]; return m; })());
  var P6 = withMarks(GRAY, (function () {
    var m = {}; m[RED] = [17];
    m[GREEN] = []; for (var i = 18; i <= 31; i++) m[GREEN].push(i);
    return m;
  })());
  var P7 = withMarks(GRAY, (function () {
    var m = {}; m[RED] = [17]; m[GREEN] = [18, 19, 20, 23, 24, 25, 29, 30];
    return m;
  })());
  var PDIM = fill(DIM), PWHITE = fill(WHITE), PGRAY = fill(GRAY);

  // Avatar variants: [bg, border, letterColor, letter]
  var AV = {
    A:    ['#E4ECFF', '#BEC4F4', '#3538CD', 'A'],
    S:    ['#FFEED3', '#ECC7A5', '#A83E00', 'S'],
    J:    ['#EBF6D6', '#C8D7AD', '#4B6B1B', 'J'],
    M:    ['#FBE6F5', '#E7B8DE', '#9E168E', 'M'],
    Jdim: ['rgba(221,221,221,0.08)', 'rgba(221,221,221,0.38)', '#DDDDDD', 'J']
  };

  // Row spec (frame "real life", top to bottom):
  // [name, nameState, info(0|14|16), pattern, avatarKey, owner, ownerDim, date, dateDim, newChip]
  var ROWS = [
    ['Cohort & Lifecycle Review',       'green',   0,  PGRAY,  'A',    'Alonzo Canada', false, 'Just created', false, true ],
    ['Trivy Vulnerability Remediation', 'green',   0,  P2,     'S',    'Milan Korsos',  false, 'Aug 2026',     false, false],
    ['Trivy Vulnerability Remediation', 'green',   0,  P3,     'J',    'Milan Korsos',  false, 'Aug 2026',     false, false],
    ['Trivy Vulnerability Remediation', 'green',   14, PDIM,   'Jdim', 'Milan Korsos',  true,  'Aug 2026',     true,  false],
    ['Trivy Vulnerability Remediation', 'dim',     0,  PDIM,   'Jdim', 'Milan Korsos',  true,  'Aug 2026',     true,  false],
    ['Trivy Vulnerability Remediation', 'dim',     0,  P6,     'A',    'Milan Korsos',  false, 'Aug 2026',     false, false],
    ['Trivy Vulnerability Remediation', 'green',   14, P7,     'S',    'Milan Korsos',  false, 'Aug 2026',     false, false],
    ['Trivy Vulnerability Remediation', 'green',   14, PWHITE, 'M',    'Milan Korsos',  false, 'Aug 2026',     false, false],
    ['Trivy Vulnerability Remediation', 'loading', 0,  PWHITE, 'J',    'Milan Korsos',  false, 'Aug 2026',     false, false],
    ['Trivy Vulnerability Remediation', 'loading', 0,  P7,     'M',    'Milan Korsos',  false, 'Aug 2026',     false, false],
    ['Trivy Vulnerability Remediation', 'green',   16, P7,     'A',    'Milan Korsos',  false, 'Aug 2026',     false, false],
    ['Trivy Vulnerability Remediation', 'green',   16, PDIM,   'Jdim', 'Milan Korsos',  true,  'Aug 2026',     true,  false],
    ['Trivy Vulnerability Remediation', 'dim',     0,  PDIM,   'Jdim', 'Milan Korsos',  true,  'Aug 2026',     true,  false],
    ['Trivy Vulnerability Remediation', 'dim',     0,  P7,     'S',    'Milan Korsos',  false, 'Aug 2026',     false, false],
    ['Trivy Vulnerability Remediation', 'green',   16, PDIM,   'Jdim', 'Milan Korsos',  true,  'Aug 2026',     true,  false]
  ];

  function infoIcon(size) {
    if (size === 14) {
      return '<svg width="14" height="14" viewBox="1 1 14 14" xmlns="http://www.w3.org/2000/svg">'
        + '<circle cx="8" cy="8" r="5.834" fill="none" stroke="#666666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>'
        + '<path d="M8 10.334v-2.334M8 5.666h0.006" fill="none" stroke="#666666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
    return '<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">'
      + '<circle cx="8" cy="8" r="6.667" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'
      + '<path d="M8 10.667v-2.667M8 5.333h0.007" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  var CAL = function (fillColor) {
    return '<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">'
      + '<path d="M11 1C13.209 1 15 2.791 15 5V11C15 13.209 13.209 15 11 15H5C2.791 15 1 13.209 1 11V5C1 2.791 2.791 1 5 1H11ZM13.5 6H2.5V11C2.5 12.381 3.619 13.5 5 13.5H11C12.381 13.5 13.5 12.381 13.5 11V6Z" fill="' + fillColor + '"/></svg>';
  };

  var KEBAB = '<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">'
    + '<circle cx="8" cy="8" r="0.667" fill="none" stroke="#6E6E74" stroke-width="1.5" stroke-linecap="round"/>'
    + '<circle cx="8" cy="3.333" r="0.667" fill="none" stroke="#6E6E74" stroke-width="1.5" stroke-linecap="round"/>'
    + '<circle cx="8" cy="12.667" r="0.667" fill="none" stroke="#6E6E74" stroke-width="1.5" stroke-linecap="round"/></svg>';

  var html = '<div class="thead">'
    + '<div class="h-name"><div class="label">Name</div></div>'
    + '<div class="h-runlogs"><div class="label">Run logs</div></div>'
    + '<div class="h-owner"><div class="label">Owner</div></div>'
    + '<div class="h-modified"><div class="label">Last modified</div></div>'
    + '<div class="h-action"><div class="label">Action</div></div>'
    + '</div>';

  ROWS.forEach(function (r) {
    var name = r[0], state = r[1], info = r[2], pattern = r[3], avKey = r[4];
    var owner = r[5], ownerDim = r[6], date = r[7], dateDim = r[8], isNew = r[9];

    var dotCls = state === 'green' ? 'green' : state === 'dim' ? 'dim' : state === 'gray' ? 'gray' : 'loading';
    var nameCls = state === 'dim' ? ' dim' : state === 'gray' ? ' gray' : '';
    var nameCell = '<div class="cell cell-name' + nameCls + '">'
      + '<div class="status-dot ' + dotCls + '"></div>'
      + '<div class="name-wrap"><div class="name">' + name + '</div>'
      + (info ? infoIcon(info) : '') + '</div>'
      + (isNew ? '<div class="new-chip">New</div>' : '')
      + '</div>';

    var dots = pattern.map(function (c) { return '<div class="d" style="background:' + c + '"></div>'; }).join('');
    var logCell = '<div class="cell cell-runlogs"><div class="dots">' + dots + '</div></div>';

    var av = AV[avKey];
    var ownerCell = '<div class="cell cell-owner' + (ownerDim ? ' dim' : '') + '">'
      + '<div class="avatar" style="background:' + av[0] + ';border:1px solid ' + av[1] + '"><span style="color:' + av[2] + '">' + av[3] + '</span></div>'
      + '<div class="owner-name">' + owner + '</div></div>';

    var modCell = '<div class="cell cell-modified' + (dateDim ? ' dim' : '') + '">'
      + CAL(dateDim ? '#DDDDDD' : '#6E6E74')
      + '<div class="date">' + date + '</div></div>';

    var actionCell = '<div class="cell cell-action">' + KEBAB + '</div>';

    html += '<div class="row">' + nameCell + logCell + ownerCell + modCell + actionCell + '</div>';
  });

  document.getElementById('table').innerHTML = html;

  /* Embedded as the "real life created agent" layer by index.html. */
  function createdClose(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (window.parent !== window) { window.parent.postMessage('rlCreatedClose', '*'); }
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') createdClose(); });
})();
</script>
